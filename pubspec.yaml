name: spin_the_wheel
description: A premium Flutter app for creating beautiful spinning wheels for random decisions.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management — Clean Architecture + Riverpod as specified in PROJECT_SPEC.md
  flutter_riverpod: ^3.3.2

  # Typography — lets the Material 3 theme use a polished Google Font instead of the system default
  google_fonts: ^6.3.0

  # Local persistence — stores wheels, history, and settings on-device (no backend required)
  shared_preferences: ^2.5.5

  # Declarative animations — powers the spin transition, winner pop-in, and general UI motion
  flutter_animate: ^4.5.2

  # Celebration effect — confetti burst when a winner is selected
  confetti: ^0.8.0

  # Sound playback — tick sounds during spin and a win jingle on result
  audioplayers: ^6.6.0

  # Vector icons/illustrations — crisp, scalable wheel/theme artwork at any screen density
  flutter_svg: ^2.3.0

  # Unique IDs — generates stable identifiers for wheels, items, and history entries
  uuid: ^4.5.3

  # Collection utilities — safe list operations (e.g. firstWhereOrNull) used across the domain layer
  collection: ^1.19.1

  # Date/time formatting — formats timestamps as relative time (e.g., "2 hours ago") in history
  intl: ^0.20.2

  path_provider: ^2.1.5

  # Share functionality — allows exporting wheels as JSON to share with others
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sounds/
    # Sound files to be added:
    # - tick.mp3 (played on each slice transition during spin)
    # - win.mp3 (played when winner is determined)
